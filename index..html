<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кошка-героиня</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ee;--card:#fff;--ink:#2b3a33;--mute:#6b7d73;--accent:#e0698f;--onacc:#fff;--line:#d9e5da;--soft:#f1f6f1;--gold:#b97d08;--hp:#e0698f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--ink:#e9f3ec;--mute:#9db1a5;--accent:#ff86ac;--onacc:#2b0b1a;--line:#2e3c34;--soft:#26332c;--gold:#ffc95c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--ink:#e9f3ec;--mute:#9db1a5;--accent:#ff86ac;--onacc:#2b0b1a;--line:#2e3c34;--soft:#26332c;--gold:#ffc95c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,"Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:12px 12px 40px}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800}
.chip b{color:var(--gold)}.chip small{color:var(--mute);font-weight:600;margin-left:6px}
.path{display:flex;gap:5px;align-items:center}
.path i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.path i.d{background:var(--accent)}
.path i.c{background:var(--card);border:3px solid var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.arena{--tx:#33503c;--ts:rgba(255,255,255,.75);position:relative;height:330px;margin-top:10px;border-radius:26px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;border:2px solid var(--line);background:#cfeaff}
.arena.fight{--tx:#fff;--ts:rgba(0,0,0,.5)}
.bg{position:absolute;inset:0;transition:opacity .7s}
.afk-bg{background:linear-gradient(#bfe3ff 0%,#e6f4ff 48%,#fdf0e2 72%)}
.fight-bg{background:linear-gradient(#3a2f7a,#251f5c 55%,#17143d)}
.fight-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 40% 10%,#fff,transparent),radial-gradient(2px 2px at 70% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 30%,#fff,transparent)}
.arena.afk .fight-bg,.arena.fight .afk-bg{opacity:0}
.sun{position:absolute;top:18px;right:24px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#fff7cf 30%,#ffe69a 62%,rgba(255,230,154,0) 72%);box-shadow:0 0 44px 20px rgba(255,236,170,.5)}
.cl{position:absolute;height:22px;border-radius:20px;background:#fff;opacity:.9;left:-100px;animation:drift linear infinite}
.cl::before,.cl::after{content:"";position:absolute;border-radius:50%;background:#fff}
.cl::before{left:12px;top:-12px;width:30px;height:30px}.cl::after{left:36px;top:-8px;width:24px;height:24px}
@keyframes drift{to{left:110%}}
.hills{position:absolute;left:-10%;right:-10%;bottom:-30px;height:170px;background:radial-gradient(60% 100% at 18% 100%,#c3e6ac 98%,transparent 100%),radial-gradient(70% 100% at 78% 100%,#a9d698 98%,transparent 100%)}
.front{position:absolute;left:-10%;right:-10%;bottom:-24px;height:96px;background:radial-gradient(80% 100% at 50% 100%,#8fc783 98%,transparent 100%)}
.dhills{position:absolute;left:-10%;right:-10%;bottom:-40px;height:120px;background:radial-gradient(60% 100% at 25% 100%,#2a2566 98%,transparent 100%),radial-gradient(60% 100% at 80% 100%,#201b52 98%,transparent 100%)}
.flw{position:absolute;left:0;right:0;bottom:8px;height:50px;background:radial-gradient(circle at 8% 40%,#ff9ec4 3px,transparent 4px),radial-gradient(circle at 21% 70%,#fff 3px,transparent 4px),radial-gradient(circle at 36% 35%,#ffd36b 3px,transparent 4px),radial-gradient(circle at 52% 78%,#ff9ec4 3px,transparent 4px),radial-gradient(circle at 67% 42%,#fff 3px,transparent 4px),radial-gradient(circle at 82% 72%,#c9b6ff 3px,transparent 4px),radial-gradient(circle at 94% 38%,#ffd36b 3px,transparent 4px)}
.tree{position:absolute;bottom:64px;width:12px;height:70px;background:#a98763;border-radius:6px}
.tree::before{content:"";position:absolute;left:-26px;top:-48px;width:64px;height:64px;border-radius:50%;background:#9fd18f;box-shadow:16px 14px 0 -6px #8fc783}
.bfl{position:absolute;top:150px;width:22px;left:-30px;animation:bfly 15s linear infinite}
.bfl svg{display:block;width:100%;animation:flap .22s ease-in-out infinite alternate}
@keyframes bfly{25%{transform:translateY(-22px)}50%{transform:translateY(8px)}75%{transform:translateY(-14px)}100%{left:105%}}
@keyframes flap{to{transform:scaleX(.55)}}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;color:var(--tx);text-shadow:0 1px 2px var(--ts);font-weight:800;font-size:.85rem}
.hud>div{flex:1;max-width:48%}.hud .r{text-align:right;transition:opacity .4s}
.arena.afk .hud .r,.arena.afk .timer{opacity:0}
.hud small{font-weight:600;display:block}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:3px;border:1.5px solid rgba(255,255,255,.7)}
.bar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .1s;margin-left:auto}
.timer{position:absolute;top:0;left:0;height:6px;width:100%;background:#ffd45a;transition:opacity .4s}
#msg{position:absolute;left:0;right:0;top:64px;text-align:center;font-weight:800;color:var(--tx);text-shadow:0 1px 3px var(--ts);pointer-events:none;font-size:1.05rem}
.unit{position:absolute;bottom:26px;pointer-events:none;transition:left .6s,width .6s,transform .35s,opacity .5s}
.unit svg{display:block;width:100%;height:auto}
.arena.afk #hero{left:27%;width:46%}.arena.fight #hero{left:2%;width:42%}
#boss{right:3%;width:43%;opacity:1}
.arena.afk #boss{opacity:0;transform:translateX(60px)}
.inner{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bump{animation:bmp .14s}
@keyframes bmp{50%{transform:scale(.95)}}
.hit{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-8px)}60%{transform:translateX(7px)}}
.dead{opacity:0!important;transform:translateY(40px) rotate(8deg)!important}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tail{transform-origin:150px 215px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
.fl{position:absolute;pointer-events:none;font-weight:800;color:#fff;font-size:1.15rem;text-shadow:0 2px 3px rgba(0,0,0,.6);animation:up .8s ease-out forwards}
.fl.c{color:#ffd45a;font-size:1.5rem}.fl.g{color:#fff;font-size:1rem;text-shadow:0 1px 3px rgba(60,80,50,.8)}
@keyframes up{to{transform:translateY(-62px);opacity:0}}
.fight-btn{display:block;width:100%;margin-top:10px;font:inherit;font-weight:800;font-size:1.05rem;min-height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--onacc);cursor:pointer;line-height:1.2;padding:8px}
.fight-btn small{display:block;font-weight:600;opacity:.85;font-size:.8rem}
.fight-btn.off{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.goal{margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.goal b{font-size:.95rem}.goal small{color:var(--mute)}
.pb{grid-column:1/-1;height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;width:0;background:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
button.tab{flex:0 0 auto;font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer}
button.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qty{display:flex;gap:6px;margin:0 0 8px}
.qty button{flex:1;font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;min-height:38px;cursor:pointer}
.qty button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.list{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:2px 14px}
.it{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it b{display:block}.it small{display:block;color:var(--mute);line-height:1.3}
.lv{color:var(--accent)}
.buy{font:inherit;font-weight:800;min-width:98px;min-height:46px;border-radius:14px;border:0;background:var(--accent);color:var(--onacc);padding:6px 12px;cursor:pointer;line-height:1.15}
.buy:disabled{background:var(--soft);color:var(--mute);cursor:default}
.buy.alt{background:var(--soft);color:var(--ink)}
.note{color:var(--mute);padding:10px 0;margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;font-weight:800;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}

:root{--b1:#ffe1ee;--b2:#dff3e6;--b3:#e5e0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#3b2441;--b2:#1d3a31;--b3:#272550}}
:root[data-theme="dark"]{--b1:#3b2441;--b2:#1d3a31;--b3:#272550}
body{min-height:100vh;background:radial-gradient(70% 45% at 8% 0%,var(--b1),transparent 72%),radial-gradient(60% 45% at 100% 22%,var(--b2),transparent 72%),radial-gradient(70% 45% at 0% 100%,var(--b3),transparent 72%),var(--bg);background-attachment:fixed}
main{position:relative;z-index:1}
.pt{position:fixed;top:-20px;border-radius:80% 0 80% 0;background:rgba(255,170,200,.55);pointer-events:none;z-index:0;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(360deg)}}
.chip,.list,.goal{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(120,100,160,.12)}
.arena{border-radius:30px;box-shadow:0 14px 34px rgba(110,90,150,.22)}
.buy,.fight-btn:not(.off){background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#fff));box-shadow:0 5px 14px rgba(224,105,143,.3)}
.buy:disabled{background:var(--soft);box-shadow:none}
button.tab{box-shadow:0 3px 10px rgba(120,100,160,.1)}
.fr{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.fr .fight-btn{margin-top:0}
.sndb{font:inherit;font-weight:800;font-size:.85rem;min-width:66px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.1}
.sndb small{display:block;font-weight:600;color:var(--mute);font-size:.72rem}
.cmp{position:absolute;width:7.8%;min-width:30px;aspect-ratio:40/44;pointer-events:none;transition:left .6s,bottom .6s;animation:cbob 2.4s ease-in-out infinite}
.arena.afk .cmp{left:var(--ax);bottom:var(--ab)}
.arena.fight .cmp{left:var(--fx);bottom:var(--fb)}
.cmp svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.cmp i{position:absolute;right:-5px;bottom:-3px;font:800 .62rem/1 Nunito,sans-serif;font-style:normal;background:var(--card);color:var(--ink);border-radius:8px;padding:2px 4px;border:1px solid var(--line)}
@keyframes cbob{50%{transform:translateY(-3px)}}
.cmp.hop{animation:hop .26s}
@keyframes hop{50%{transform:translateY(-14px)}}
.br{transform-origin:120px 246px;animation:brth 3.6s ease-in-out infinite}
@keyframes brth{50%{transform:scaleY(1.016)}}
.head{transform-origin:120px 152px;animation:tilt 6.5s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2deg)}}
.hairs{transform-origin:120px 90px;animation:hsw 5s ease-in-out infinite}
@keyframes hsw{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.4deg)}}
.earL{transform-origin:92px 62px;animation:twl 7s infinite}
.earR{transform-origin:148px 62px;animation:twr 9s infinite 2.5s}
@keyframes twl{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-9deg)}96%{transform:rotate(3deg)}}
@keyframes twr{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(9deg)}96%{transform:rotate(-3deg)}}
.look{animation:look 9s ease-in-out infinite}
@keyframes look{0%,35%,100%{transform:translate(0,0)}42%,58%{transform:translate(-2.5px,1px)}68%,85%{transform:translate(2.5px,0)}}
.wh{transform-origin:120px 130px;animation:whs 4s ease-in-out infinite}
@keyframes whs{50%{transform:rotate(1.5deg)}}
.eh,.mo{display:none}
.meow .mo{display:inline}.meow .mc{display:none}.happy .eyes{display:none}.happy .eh{display:inline}
.say{position:absolute;right:4%;top:92px;max-width:46%;background:#fff;color:#2b2748;border-radius:16px;padding:7px 11px;font-weight:700;font-size:.82rem;line-height:1.25;box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:0;transform:translateY(6px) scale(.96);transition:.25s;pointer-events:none;z-index:3}
.say.on{opacity:1;transform:none}
.say::after{content:"";position:absolute;bottom:-7px;right:30px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.fight-bg::before{display:none}
.fight-bg{background:#e3f1ed}
.fight-bg svg{display:block;width:100%;height:100%}
.arena.fight{--tx:#2b3a46;--ts:rgba(255,255,255,.85)}
.path{font-weight:800;color:var(--mute);font-size:.9rem;white-space:nowrap}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(40,30,70,.45);backdrop-filter:blur(6px)}
.ov[hidden]{display:none}
.dlg{width:min(360px,100%);background:var(--card);border-radius:24px;padding:22px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}
.dlg h2{margin:0 0 6px;font-size:1.3rem}
.dlg p{margin:0 0 14px;color:var(--mute)}
.dlg input{width:100%;font:inherit;font-weight:700;text-align:center;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.dlg input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dlg .buy{width:100%}
.dev{margin-top:16px;background:var(--card);border:2px dashed var(--accent);border-radius:18px;padding:12px;font-size:.85rem}
.dev[hidden]{display:none}
.dev h3{margin:0 0 6px}
.dg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.dg b{min-width:60px}
.dev button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:6px 10px;min-height:36px;cursor:pointer}
.dev button.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.dev input[type=number]{width:72px;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--soft);color:var(--ink)}
.dev textarea{width:100%;min-height:70px;font:12px monospace;border-radius:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink)}
.dvt{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.dvt table{width:100%;border-collapse:collapse;font-size:.78rem}
.dvt td,.dvt th{padding:3px 6px;text-align:left;border-bottom:1px solid var(--line)}
.tk{color:#2a9d62}.tm{color:#c98a0b}.tb{color:#d33}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="bar0"><div class="chip"><b id="fish">0</b> рыбок<small id="ps"></small></div><div class="path" id="path" aria-label="Путь по боссам"></div></div>
  <div class="arena afk" id="arena">
    <div class="bg afk-bg"><i class="sun"></i><i class="cl" style="top:40px;width:72px;animation-duration:70s"></i><i class="cl" style="top:84px;width:52px;animation-duration:95s;animation-delay:-40s"></i><i class="cl" style="top:20px;width:60px;animation-duration:120s;animation-delay:-80s"></i><div class="hills"></div><i class="tree" style="left:6%"></i><i class="tree" style="right:7%;height:58px"></i><div class="front"></div><div class="flw"></div>
      <div class="bfl"><svg viewBox="0 0 24 24"><ellipse cx="7" cy="8" rx="6" ry="7" fill="#ff9ec4"/><ellipse cx="17" cy="8" rx="6" ry="7" fill="#8ec5ff"/><ellipse cx="8" cy="17" rx="4" ry="4.5" fill="#ffd36b"/><ellipse cx="16" cy="17" rx="4" ry="4.5" fill="#b7f0c0"/><rect x="11" y="5" width="2" height="15" rx="1" fill="#4a3d5e"/></svg></div></div>
    <div class="bg fight-bg" id="fbg"></div>
    <div class="timer" id="tm"></div>
    <div class="hud">
      <div><span id="hn"></span><small id="hd"></small></div>
      <div class="r"><span id="bn"></span><div class="bar"><i id="bhp"></i></div><small id="bht"></small></div>
    </div>
    <div id="msg"></div>
    <div id="say" class="say"></div>
    <div class="unit" id="hero"><div class="inner">
<svg viewBox="0 0 240 260" aria-hidden="true" id="catsvg">
<defs>
<linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f1e1c6"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0b07c"/><stop offset="1" stop-color="#a68350"/></linearGradient>
<radialGradient id="iris" cx=".5" cy=".3" r=".75"><stop offset="0" stop-color="#78936a"/><stop offset="1" stop-color="#29452f"/></radialGradient>
<linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9cadc"/><stop offset="1" stop-color="#ee9dbb"/></linearGradient>
</defs>
<ellipse cx="120" cy="248" rx="72" ry="9" fill="#000" opacity=".12"/>
<g id="l-wing"><path d="M118 150C60 90 22 112 12 68c48 0 92 24 108 64z" fill="#fff" opacity=".9" stroke="#cfd8f0"/><path d="M122 150c58-60 96-38 106-82-48 0-92 24-108 64z" fill="#fff" opacity=".9" stroke="#cfd8f0"/></g>
<g class="tail"><path d="M150 220C204 232 232 190 216 152C210 138 198 134 192 140" stroke="#efdfc3" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M216 152C210 138 198 134 192 140" stroke="#fffaf1" stroke-width="15" fill="none" stroke-linecap="round"/></g>
<g class="hairs"><path d="M64 94C38 140 44 192 72 218C62 176 74 134 88 108z" fill="url(#hair)"/><path d="M176 94C202 140 196 192 168 218C178 176 166 134 152 108z" fill="url(#hair)"/></g>
<g class="br">
<path d="M86 158Q120 148 154 158L184 240Q120 256 56 240Z" fill="url(#dress)"/>
<path d="M60 232Q72 244 84 236Q96 248 108 240Q120 250 132 240Q144 248 156 236Q168 244 180 232" stroke="#fff" stroke-width="3" fill="none" opacity=".75" stroke-linecap="round"/>
<path d="M96 190Q120 202 144 190" stroke="#fff" stroke-width="2" fill="none" opacity=".55"/>

+'<p class="note" style="padding:0 0 6px"><b>Баланс при текущей прокачке</b> (нужно кликов в секунду: до 6 зелёный, до 10 жёлтый, выше красный). '+(stuck?'Упрёшься в клиента №'+stuck+'.':'Все 20 клиентов проходимы.')+'</p>'
+'<div class="dvt"><table><tr><th>№</th><th>Клиент</th><th>Упрямство</th><th>Клик/с</th></tr>'+rows+'</table></div>'
+'<div class="dg"><b>Данные</b>'+b('exp','экспорт')+b('imp','импорт')+b('rst','Полный сброс')+b('x','закрыть')+'</div><textarea id="dvj" aria-label="JSON сохранения" spellcheck="false"></textarea>';devSt()}
function devSpawn(){spawn();if(mode==='fight')tEnd=Date.now()+tlim()*1000}
$('dev').addEventListener('click',function(e){var el=e.target.closest('button'),a=el&&el.dataset.a;if(!a)return;
if(a.slice(0,2)==='f+')gain(+a.slice(2));
else if(a==='f*10')gain(S.f*9);
else if(a==='f=0')S.f=0;
else if(a==='b-1'||a==='b+1'){S.bi=Math.max(0,S.bi+(a==='b+1'?1:-1));devSpawn()}
else if(a==='bgo'){S.bi=Math.max(0,(+$('dbn').value||1)-1);devSpawn()}
else if(a==='kill'){if(mode==='fight'&&!dying){bhp=0;win()}else toast('Сначала начни бой')}
else if(a==='s+10'||a==='s+50'){var n=+a.slice(2);Object.keys(S.st).forEach(function(k){S.st[k]+=n})}
else if(a==='s=0')Object.keys(S.st).forEach(function(k){S.st[k]=0});
else if(a==='h+10'||a==='h+100'){var m=+a.slice(2);S.h=S.h.map(function(v){return v+m})}
else if(a==='h=0')S.h=H.map(function(){return 0});
else if(a==='wd'){WD.forEach(function(_,i){S.w[i]=1;S.wo[i]=1});drawW()}
else if(a==='gc'){G.forEach(function(g,i){if(!S.gc[i]&&g[1](S)>=g[2])claim(i)})}
else if(a==='gs'){S.ck=Math.max(S.ck,1e4);S.cr=Math.max(S.cr,1e3);S.all=Math.max(S.all,1e12)}
else if(a==='fz')D.fz^=1;
else if(a==='dm')D.dm=DM[(DM.indexOf(D.dm)+1)%DM.length];
else if(a==='ts')D.ts=TS[(TS.indexOf(D.ts)+1)%TS.length];
else if(a==='auto'){D.auto^=1;clearInterval(D.ai);if(D.auto)D.ai=setInterval(tap,1000/D.cps)}
else if(a==='cps'){D.cps=CP[(CP.indexOf(D.cps)+1)%CP.length];if(D.auto){clearInterval(D.ai);D.ai=setInterval(tap,1000/D.cps)}}
else if(a==='exp'){$('dvj').value=JSON.stringify(S);return}
else if(a==='imp'){try{S=Object.assign(fresh(),JSON.parse($('dvj').value));csig='';drawW();spawn();toast('Сохранение загружено')}catch(x){toast('Не удалось прочитать JSON');return}}
else if(a==='rst'){if(!rc){rc=1;el.textContent='Точно сбросить?';setTimeout(function(){rc=0;if(el.isConnected)el.textContent='Полный сброс'},3000);return}rc=0;S=fresh();S.nm='';try{localStorage.removeItem('cathero-v2')}catch(x){}csig='';setMode('afk');drawW();spawn();openName()}
else if(a==='x'){$('dev').hidden=true;return}
save();render();head();goalBar();devUI()});
$('fish').parentNode.addEventListener('click',function(){var n=Date.now();ct=n-cl<1500?ct+1:1;cl=n;if(ct>=5){ct=0;$('dev').hidden=!$('dev').hidden;if(!$('dev').hidden){devUI();$('dev').scrollIntoView({behavior:'smooth'})}}});
if(location.hash==='#dev'){$('dev').hidden=false;devUI()}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on')},3200)}
function gain(x){S.f+=x;S.all+=x}
function drawW(){WD.forEach(function(w,i){$('l-'+w.k).style.display=S.wo[i]?'':'none'})}
function anim(id,c){var e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
function fl(txt,cls,id){var a=$('arena'),u=$(id),e=document.createElement('span');e.className='fl '+cls;e.textContent=txt;e.style.left=(u.offsetLeft+u.offsetWidth*(.25+Math.random()*.4))+'px';e.style.top=(u.offsetTop+20+Math.random()*40)+'px';a.appendChild(e);setTimeout(function(){e.remove()},800)}
function say(txt,ms){var e=$('say');e.textContent=txt;e.classList.add('on');clearTimeout(say.h);say.h=setTimeout(function(){e.classList.remove('on')},ms||2600)}
function spawn(){boss=bossAt(S.bi);bhp=boss.hp;$('boss').innerHTML=bsvg(boss);$('boss').classList.remove('dead');dying=0;if(mode==='fight')say(boss.l[Math.floor(Math.random()*boss.l.length)])}
function setMode(m){mode=m;$('arena').className='arena '+m;if(m==='fight'){spawn();tEnd=Date.now()+tlim()*1000;nextSay=Date.now()+4500}else $('say').classList.remove('on');label()}
function label(){var b=$('fightbtn');if(mode==='fight'){b.className='fight-btn off';b.innerHTML='Уйти на перерыв<small>вернуться на поляну и копить рыбки</small>'}else{var n=bossAt(S.bi);b.className='fight-btn';b.innerHTML='Принять клиента: «'+n.n+'»<small>упрямство '+F(n.hp)+', время '+tlim().toFixed(1)+' с, убеждай кликами</small>'}}
function win(){dying=1;sfx('win');var r=boss.hp*.35*luck();gain(r);S.bi++;$('boss').classList.add('dead');toast('Обслужила: «'+boss.n+'». +'+F(r)+' рыбок');say(DEF[Math.floor(Math.random()*DEF.length)],1500);setTimeout(function(){if(mode!=='fight')return;spawn();tEnd=Date.now()+tlim()*1000;render()},800)}
function lose(){sfx('lose');toast('Клиент ушёл с жалобой... Прокачайся и попробуй снова');setMode('afk')}
function tap(){S.ck++;var c=Math.random()<cch(),d=dmg()*(c?cm():1);if(c)S.cr++;if(!D.auto)meow(c?'c':mode==='fight'?'f':'n');face(c);hop();
if(mode==='afk'){var f=Math.max(.5,d*.12)*luck();gain(f);fl('+'+F(f),c?'c':'g','hero');anim('hero','bump')}
else if(!dying){bhp-=d;fl((c?'КРИТ ':'')+F(d),c?'c':'','boss');anim('boss','hit');if(bhp<=0)win()}}
$('arena').addEventListener('pointerdown',function(e){e.preventDefault();tap()});
$('fightbtn').onclick=function(){setMode(mode==='fight'?'afk':'fight')};
function row(id,n,d,c,l,alt){return'<div class="it"><div><b>'+n+'</b><small>'+d+'</small></div><button class="buy'+(alt?' alt':'')+'" data-id="'+id+'" data-c="'+c+'">'+l+'</button></div>'}
function render(){
var h='';
document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===tab)});
$('qty').style.display=tab==='f'||tab==='o'?'':'none';
document.querySelectorAll('#qty button').forEach(function(b){b.setAttribute('aria-pressed',+b.dataset.q===q)});
if(tab==='s'){var V={atk:function(){return'урон за клик '+F(dmg())},agi:function(){return'крит '+Math.round(cch()*100)+'%'},mag:function(){return'крит ×'+cm().toFixed(1)},end:function(){return'время боя '+tlim().toFixed(1)+' с'},luck:function(){return'×'+(luck()/wm()).toFixed(1)+' рыбок'}};
ST.forEach(function(s){var c=scost(s[0]);h+=row('k'+s[0],s[1]+' <span class="lv">ур. '+S.st[s[0]]+'</span>',s[2]+': '+V[s[0]](),c,'Прокачать<br>'+F(c))});
h+='<p class="note">Сила, Ловкость и Меткость делают клики мощнее, Выдержка даёт больше времени на бой, Удача увеличивает рыбки.</p>';h+=row('n','Имя героини',S.nm||'без имени',0,'Изменить',1)}
else if(tab==='f'||tab==='o'){H.forEach(function(x,i){if(tab==='f'?x.t!=='e':x.t==='e')return;var c=hcost(i,q),e=x.t==='e'?x.d+'. +'+F(x.v*luck()*.6)+' рыбок/с каждый':x.t==='f'?x.d+'. +'+F(x.v*wm())+' к клику каждый':x.d;h+=row('h'+i,x.n+' <span class="lv">'+S.h[i]+'</span>',e,c,'Нанять ×'+q+'<br>'+F(c))})}
else if(tab==='w'){h='<p class="note">Каждый наряд даёт +3% к урону и рыбкам.</p>';WD.map(function(_,i){return i}).sort(function(a,b){return WD[a].c-WD[b].c}).forEach(function(i){var x=WD[i];h+=S.w[i]?row('w'+i,x.n,S.wo[i]?'Надето':'В шкафу',0,S.wo[i]?'Снять':'Надеть',1):row('w'+i,x.n,'+3% к урону и рыбкам',x.c,F(x.c))})}
else{G.forEach(function(g,i){var p=Math.min(g[1](S),g[2]),cl=S.gc[i];h+='<div class="it"><div><b>'+(cl?'✓ ':'')+g[0]+'</b><small>Награда: '+(g[3].f?F(g[3].f)+' рыбок':'+1 уровень: '+ST.filter(function(s){return s[0]===g[3].s})[0][1])+'</small><div class="pb"><i data-g="'+i+'"></i></div></div>'+(cl?'':'<button class="buy" data-id="g'+i+'" data-c="0" disabled>Забрать</button>')+'</div>'})}
$('list').innerHTML=h;label();upd();crew()}
function claim(i){var g=G[i];if(S.gc[i]||g[1](S)<g[2])return;S.gc[i]=1;if(g[3].f)gain(g[3].f);else S.st[g[3].s]++;toast('Награда получена!');sfx('g');render()}
function upd(){document.querySelectorAll('.buy[data-c]').forEach(function(b){var id=b.dataset.id;if(id[0]==='g'){var g=G[+id.slice(1)];b.disabled=g[1](S)<g[2]}else b.disabled=+b.dataset.c>S.f&&+b.dataset.c>0});
document.querySelectorAll('[data-g]').forEach(function(e){var g=G[+e.dataset.g];e.style.width=Math.min(100,g[1](S)/g[2]*100)+'%'})}
function goalBar(){var n=-1,i;for(i=0;i<G.length;i++){if(!S.gc[i]&&G[i][1](S)>=G[i][2]){n=i;break}}
if(n<0)for(i=0;i<G.length;i++){if(!S.gc[i]){n=i;break}}
var el=$('goal');if(n<0){el.innerHTML='<b>Все цели выполнены!</b><small>Дальше только новые боссы</small>';return}
var g=G[n],p=Math.min(g[1](S),g[2]),ok=p>=g[2],s=n+':'+ok;
if(el.dataset.s!==s){el.dataset.s=s;el.innerHTML='<b>Цель: '+g[0]+'</b>'+(ok?'<button class="buy" id="gc" style="min-height:38px">Забрать</button>':'<small id="gp"></small>')+'<div class="pb"><i id="gb"></i></div>';if(ok)$('gc').onclick=function(){claim(n)}}
$('gb').style.width=p/g[2]*100+'%';if($('gp'))$('gp').textContent=F(p)+' / '+F(g[2])}
function head(){var n=Date.now();$('fish').textContent=F(S.f);$('ps').textContent='+'+F(fps())+'/с';
$('hn').textContent=(S.nm||'Героиня')+', ур. '+(1+Object.keys(S.st).reduce(function(a,k){return a+S.st[k]},0));$('hd').textContent='урон за клик '+F(dmg());
if(mode==='fight'){var l=Math.max(0,(tEnd-n)/1000);$('bn').textContent=boss.n;$('bhp').style.width=Math.max(0,bhp/boss.hp*100)+'%';$('bht').textContent=F(Math.max(0,bhp))+' / '+F(boss.hp);$('tm').style.width=Math.min(100,l/tlim()*100)+'%';$('msg').textContent='Осталось '+l.toFixed(1)+' с, жми быстрее!'}
else{$('msg').textContent='Гладь кошку, чтобы получать рыбки'}
var p=S.bi%20,ph='Клиент '+(p+1)+' из 20';if($('path').dataset.p!==ph){$('path').dataset.p=ph;$('path').textContent=ph}}
$('tabs').innerHTML=[['s','Герой'],['f','Ферма'],['o','Отряд'],['g','Цели'],['w','Гардероб']].map(function(t){return'<button class="tab" role="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
$('qty').innerHTML=[1,10,100].map(function(n){return'<button data-q="'+n+'">×'+n+'</button>'}).join('');
$('tabs').addEventListener('click',function(e){var t=e.target.closest('.tab');if(t){tab=t.dataset.t;render()}});
$('qty').addEventListener('click',function(e){var t=e.target.closest('button');if(t){q=+t.dataset.q;render()}});
$('list').addEventListener('click',function(e){var b=e.target.closest('.buy');if(!b||b.disabled)return;var id=b.dataset.id,c=+b.dataset.c,t=id[0],r=id.slice(1);
if(t==='n'){openName();return}
if(t==='g'){claim(+r);return}
if(t==='h'){S.f-=c;S.h[+r]+=q;sfx('h')}
else if(t==='k'){S.f-=c;S.st[r]++;sfx('k')}
else if(t==='w'){var i=+r;if(S.w[i])S.wo[i]=S.wo[i]?0:1;else{S.f-=c;S.w[i]=1;S.wo[i]=1}drawW();sfx('w')}
render()});
var last=Date.now(),sec=0;
setInterval(function(){var n=Date.now(),dt=Math.min((n-last)/1000,3600);last=n;gain(fps()*dt*D.ts);
if(D.fz&&mode==='fight')tEnd=n+tlim()*1000;if(mode==='fight'&&!dying&&n>=tEnd)lose();
if(mode==='fight'&&!dying&&n>=nextSay){say(boss.l[Math.floor(Math.random()*boss.l.length)]);nextSay=n+4200+Math.random()*2500}
head();upd();goalBar();if(!$('dev').hidden)devSt();if(++sec>=100){sec=0;save()}},100);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
var off=Math.min((Date.now()-S.t)/1000,28800);if(off>60&&fps()>0){var og=fps()*off*.5;gain(og);toast('Пока тебя не было, ферма принесла +'+F(og)+' рыбок')}
$('boss').innerHTML=bsvg(boss);$('fbg').innerHTML=pharm();drawW();sndLab();petals();render();head();goalBar();if(!S.nm)openName();
})();
</script>
</body>
</html>
